# Defaults for research-rag: every key this app reads, at its packaged value.
#
# This file ships inside the package. A layer above it names only what it
# changes, and a key not declared here is refused in every layer, so a typo is an
# error rather than a silent default. `research-rag help settings` names the
# layers; `research-rag config` prints each effective value, the layer it came
# from, what the key does, and what a change to it costs.

[language]
corpus = "en"
bm25_stopwords = ""

[runtime]
offline = false
search_history = true
log_level = "warn"
tool_detail = "lean"
embedding_threads = 0
nice = 10
search_concurrency = 2
model_cache_root = ""

[retrieval]
duplicate_cosine = 0.99
rrf_k = 60
bm25_weight = 1.25
dense_weight = 1.0
minimum_candidates = 20
maximum_candidates = 200
dense_minimum_cosine_similarity = 0.72
rerank_max_candidates = 50
rerank_window_multiple = 2
rerank_window_floor = 10
prf = false
prf_documents = 5
prf_terms = 8
maximum_withheld_examples = 5
source_diversity_penalty = 0.25
dense_relative_similarity_margin = 0.10
minimum_passage_words = 0
minimum_passage_token_fraction = 0.0
exclude_apparatus = false

[chunking]
size = 384
overlap = 64
headers = false
batch_units = 128

[ingestion]
work_budget_seconds = 1800
maximum_unclean_percent = 1.0
embedding_batch_size = 64
pdf_page_batch_size = 8
pdf_backend = "docling"

[dense]
embedding_model = "BAAI/bge-small-en-v1.5"
backend = "auto"
reranker_model = "Xenova/ms-marco-MiniLM-L-6-v2"
embedding_inference_batch_size = 1
exact_backend_chunk_limit = 200000

[synthesis]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
max_searches = 8
max_attempts = 3
timeout_seconds = 300
