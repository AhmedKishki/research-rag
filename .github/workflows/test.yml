name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      # One version's failure must not hide the other's, or 3.11 stops being
      # tested the first time 3.12 breaks.
      fail-fast: false
      matrix:
        # The range `pyproject.toml` declares and nothing wider: 3.13 is not
        # claimed until the matrix says it is green.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Required, not a convenience: the checkout's `.python-version` file takes
      # precedence over the interpreter setup-python installed, and outranks
      # `--python` on `uv sync`, so the later `uv run` steps would put 3.12 back
      # and 3.11 would only report green. The variable reaches every uv step.
      - run: uv sync --frozen
      - name: Report the interpreter the matrix leg actually resolved
        run: uv run python -VV
      # `desktop-file-validate` is what makes the installed menu entry a checked
      # claim rather than a skipped one. It is not on the runner by default.
      - name: Install the desktop entry validator
        run: sudo apt-get update && sudo apt-get install --yes desktop-file-utils
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run python -m compileall -q src tests
      - name: Fast tests
        run: uv run pytest -q -m "not integration"
      - name: Integration tests
        run: uv run pytest -q -m integration
