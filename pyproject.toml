[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-rag"
version = "2.0.0"
description = "A browser workspace for reviewing research evidence over a project's own PDF, EPUB and MOBI corpus"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "bm25s @ git+https://github.com/AhmedKishki/bm25s.git@20f6c02612b8114dca4662131ba09d5102c53308",
    "chonkie==1.7.0",
    "tiktoken==0.14.0",
    "scipy>=1.10,<2",
    "PyStemmer>=2.2,<3",
    "orjson==3.12.0",
    "beautifulsoup4>=4.13,<5",
    "ebooklib>=0.20,<1",
    # KindleUnpack's read-only MOBI header, decompression and KF8 reconstruction.
    "mobi==0.4.1",
    "fastembed==0.8.0",
    "fastmcp==3.4.0",
    # The control channel between the command line and the running app.
    "httpx>=0.28",
    # Resolve exact ONNX snapshots before giving their paths to FastEmbed.
    "huggingface-hub>=0.20,<2",
    "filelock>=3.16,<5",
    "numpy>=1.26,<3",
    # Preserve the historical BM25 indexing and search implementation.
    "numba==0.65.0",
    "platformdirs>=4.3,<5",
    "starlette>=1.6,<2",
    "tokenizers>=0.20,<1",
    "tokie>=0.1,<1",
    "pydantic>=2.12,<3",
    "pymupdf>=1.26,<2",
    "qdrant-client==1.19.1",
    # Generate phone-access QR codes locally, without sending URLs to a service.
    "qrcode>=8.2,<9",
    "uvicorn>=0.53,<1",
]

[project.optional-dependencies]
# The historical gateway remains available, but normal retrieval does not spawn it.
legacy = [
    "ultrarag @ https://github.com/OpenBMB/UltraRAG/archive/3a709a2aea3fbe46acca59c422621c94b6e86857.tar.gz",
]

[project.scripts]
research-rag = "research_rag.surfaces.cli:main"
# The gateway this app spawns to reach UltraRAG's own stages, and the runtime
# installer behind `doctor --repair-runtime`. Both were a separate product's
# console scripts and are this app's own now.
research-rag-gateway = "research_rag.gateway.server:main"
research-rag-runtime = "research_rag.gateway.runtime:main"

[project.urls]
Repository = "https://github.com/AhmedKishki/research-rag"
Issues = "https://github.com/AhmedKishki/research-rag/issues"
"Upstream UltraRAG" = "https://github.com/OpenBMB/UltraRAG"
"UltraRAG Documentation" = "https://ultrarag.openbmb.cn/pages/en/getting_started/introduction"

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The default settings ship with the package: the code has no copy of them.
research_rag = ["default.toml"]
# The workspace's assets ship with the code that serves them, so a wheel holds
# one copy of each.
"research_rag.surfaces.workspace" = ["static/*.css", "static/*.html", "static/*.js"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: exercises external runtimes, process contention, live transport waits, or shipped scripts",
]
# A hang has no diagnostic and blocks CI until the GitHub limit, and several
# tests spawn real subprocesses. The thread method is deliberate: the signal
# default misses a hang inside a C extension such as ONNX inference. It kills
# the whole pytest process after dumping every thread's stack, which is what CI
# wants and not what a developer's long local run wants, so a developer passes
# `--timeout=0` to turn it off.
timeout = 300
timeout_method = "thread"

[tool.ruff]
# The default set (E4, E7, E9, F) stays selected; these are added on top of it.

[tool.ruff.lint]
extend-select = ["ASYNC", "BLE001", "C901", "RUF100", "SIM"]

[tool.ruff.lint.mccabe]
# Permits the 22 functions already between 11 and 23, and fails anything new
# above 25. The two that exceed it carry a targeted noqa naming the tracked
# work, so this stays green while a third function cannot slip through.
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Tests and benchmark harnesses are async coroutines that touch the filesystem
# by design and serve no concurrent traffic. src/ keeps both rules.
"tests/**" = ["ASYNC109", "ASYNC240"]
"scripts/**" = ["ASYNC240"]
